apiVersion: v1
kind: Namespace
metadata:
  name: airbyte
---
apiVersion: v1
kind: Namespace
metadata:
  name: dagview
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dagview-data
  namespace: dagview
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagview
  namespace: dagview
  labels:
    app: dagview
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dagview
  template:
    metadata:
      labels:
        app: dagview
    spec:
      containers:
        - name: dagview
          image: dagview:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DAGVIEW_DUCKDB_PATH
              value: /app/data/dagview.duckdb
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dagview-data
---
apiVersion: v1
kind: Service
metadata:
  name: dagview
  namespace: dagview
spec:
  type: NodePort
  selector:
    app: dagview
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 32200
