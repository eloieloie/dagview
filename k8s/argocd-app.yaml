apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dagview
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/eloieloie/dagview.git
    targetRevision: main
    path: k8s
    directory:
      include: "manifests.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: dagview
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
