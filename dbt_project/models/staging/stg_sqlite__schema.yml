version: 2

# Note: these models used to read directly from attached SQLite files
# (db1/db2 aliases). They now read from dagview_raw.public.* in the
# Airbyte-fed Postgres landing zone (attached as `airbyte_raw`) --
# see profiles.yml and dbt_project/README or model-level comments for
# the full Airbyte sync lineage.

models:
  - name: stg_sqlite_customers
    description: "Customers staged from the Airbyte-synced customers table (originally db1_customers.sqlite)."
    columns:
      - name: customer_id
        description: "Primary key for a customer."
        tests:
          - unique
          - not_null

  - name: stg_sqlite_orders
    description: "Orders staged from the Airbyte-synced orders table (originally db2_orders.sqlite)."
    columns:
      - name: order_id
        description: "Primary key for an order."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to stg_sqlite_customers."
        tests:
          - not_null

  - name: stg_sqlite_order_items
    description: "Order line items staged from the Airbyte-synced order_items table (originally db2_orders.sqlite)."
    columns:
      - name: order_item_id
        description: "Primary key for an order line item."
        tests:
          - unique
          - not_null
